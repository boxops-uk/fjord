[workspace]
members = ["crates/*"]
# **Stated, because a virtual manifest does not inherit it.** While `fjord-cli` was the
# root *package*, its `edition = "2024"` implied `resolver = "3"` for the whole workspace;
# a manifest with no package defaults to `resolver = "1"` and only warns. Feature
# unification is not a formatting detail — resolver 1 unifies features across
# build-dependencies and target-specific dependencies, which is how an optional
# `proptest` ends up linked into a release binary. This keeps what the workspace already
# had.
resolver = "3"
# So `cargo test` and `cargo test -- --ignored --list` — the coverage ledger
# (AGENTS.md, testing) — keep meaning "everything". `members` is already every crate;
# stating `default-members` as well is what stops a future `exclude` or a
# `--no-default-features` habit from quietly narrowing the ledger.
default-members = ["crates/*"]

# **One version for the whole workspace, and one licence.**
#
# Every crate inherits these with `x.workspace = true`, so a release is one edit here
# rather than ten that can disagree. crates.io refuses a package without `description`
# and `license`, so those are per-crate — a description is the one field that has to
# differ — and everything a release stamps identically is stated once.
[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/boxops-uk/fjord"
# Edition 2024's floor. Stated rather than left implicit so crates.io and docs.rs can
# advertise it, and so raising it is a visible decision rather than a `cargo update`.
rust-version = "1.85"

# Versions live here so a crate cannot drift — the fjall pin in particular is
# load-bearing (see `fjord-store`).
[workspace.dependencies]
byteview = "0.10.1"
fjall = "=3.1.8"
memchr = "2.8.2"
lasso = "0.7.3"
serde = { version = "1.0.150", features = ["derive"] }
thiserror = "2.0.18"

# **The storage engine, from our fork, until these land upstream.**
#
# Two changes fjall does not have yet: the journal writer is released before the
# memtable apply, which is most of the write path's contention, and a keyspace may put
# a Bloom filter on its active memtable, which is most of interning's cost. Both are
# proposed upstream; this section is how we ship in the meantime and the thing to delete
# when they are released.
#
# **Pinned by commit, never by branch.** A branch would let the engine under a `--locked`
# build move without the lockfile saying so, which is the one failure mode a pin exists
# to prevent. The commits are on the forks' `ship` branch, which is deliberately not
# their `experiment/write-path`: that carries a flat-combining write pipeline which
# measures to nothing at the commit sizes this database writes, and is not worth its
# concurrency risk here. Every published crate here is a client of the wire protocol and reaches
# neither of these, so no consumer of ours inherits the patch — `[patch]` is ignored for
# a published package, and this is only load-bearing for our own binaries.
[patch.crates-io]
fjall = { git = "https://github.com/boxops-uk/fjall", rev = "85f2ee50b3b609d3f18f5e66f80c0f86cc98fe46" }
lsm-tree = { git = "https://github.com/boxops-uk/lsm-tree", rev = "4ba4cfdfd25df81ce52c92694161121db5bef7b8" }
