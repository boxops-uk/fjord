[package]
name = "fjord-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Fjord DB's write funnel: interning a nested fact into the store — an internal crate"
# Not on crates.io. A package is the client library for a language and nothing
# else — what it takes to construct facts, talk to a database and read rows back.
# This is an internal of the implementation, and publishing it would make its
# shape somebody's dependency.
publish = false

[dependencies]
# The three things a fact has to cross to get in: the wire form it arrived as, the
# storage form it is written in, and the store that holds it. This crate is that
# crossing and nothing else — which is why it is its own crate rather than a module
# of any of them, since each would then have to know about the other two.
fjord-encoding = { path = "../fjord-encoding" }
fjord-schema = { path = "../fjord-schema" }
fjord-store = { path = "../fjord-store" }
# The fjall backend by name, and deliberately: interning claims ids durably and
# writes through a batch, so this crate needs a real database rather than the
# seam.
fjord-store-fjall = { path = "../fjord-store-fjall" }
fjord-wire = { path = "../fjord-wire" }
thiserror = { workspace = true }

[dev-dependencies]
fjord-wire = { path = "../fjord-wire", features = ["proptest"] }
# The counting allocator, for `fused_is_allocation_free` and `examples/write_allocations`.
# It installs its own `#[global_allocator]`, so it belongs to the crates that measure
# themselves and never to one that already has one — `fjord-cli`'s manifest says the
# same thing from the other side.
allocation-counter = "0.8.1"
# The read path, which `examples/write_allocations` prints beside the write path so the
# two are comparable numbers rather than two arguments. The engine does not depend on
# this crate, so a dev-only edge here is no cycle — and it is dev-only because writing
# a fact never runs a query. `FrozenStore` behind `fjord-store`'s `proptest` feature is
# the allocation-free store the engine's own I9 guard reads from; `MemStore`'s scan
# clones a `Vec` per row and would report the model store's cost as the executor's.
fjord-engine = { path = "../fjord-engine" }
fjord-store = { path = "../fjord-store", features = ["proptest"] }
tokio-util = "0.7.18"
# `dump::rows_of`, which walks a real store's rows so the differential guards can
# compare them byte for byte.
fjord-store-mem = { path = "../fjord-store-mem" }
lasso = { workspace = true }
proptest = "1.11.0"
tempfile = "3.24.0"
